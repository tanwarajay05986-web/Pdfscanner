name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PDFScanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.akay.pdfscanner/.MainActivity
            sleep 20
            adb logcat -d | grep -E "AndroidRuntime|FATAL|akay" | tail -n 60 > crash.txt
      - name: Show result
        if: always()
        run: |
          echo '### Emulator result' >> $GITHUB_STEP_SUMMARY
          if [ -s crash.txt ]; then
            sed 's/^/    /' crash.txt >> $GITHUB_STEP_SUMMARY
          else
            echo 'Koi crash log nahi mila' >> $GITHUB_STEP_SUMMARY
          fi
